# Render Blueprint: New + > Blueprint, pick this repo. Free plans sleep after inactivity and cold-start slowly.
services:
  - type: web
    name: maintaina-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m maintaina.train
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
  - type: web
    name: maintaina-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app/streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_URL            # after the API is live, set this to its URL, e.g. https://maintaina-api.onrender.com
        sync: false
